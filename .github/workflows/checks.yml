name: Kit checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kit-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build and unit checks
        run: npm run check
      - name: Verify generated tokens are current
        run: git diff --exit-code -- tokens/serenity-theme.css tokens/token-manifest.json
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify public preview boundaries
        run: node scripts/check-public-runtime.mjs
      - name: Verify the packed consumer
        run: npm run check:package
      - name: Desktop and mobile browser regression
        run: npm run test:browser -- --workers=2
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: verification-evidence
          path: |
            package-check-results/
            playwright-report/
            test-results/
          retention-days: 14
